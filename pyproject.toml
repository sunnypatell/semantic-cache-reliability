[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cacherel"
version = "0.1.0"
description = "Measurement and calibration for embedding-based semantic caching for LLMs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sunny Patel" }]
license = { text = "LicenseRef-Proprietary" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
